# Render 배포 설정 (Blueprint)
# https://render.com 에서 New → Blueprint → 이 저장소를 선택하면
# 아래 설정대로 서비스가 자동으로 만들어져요.
# 백엔드 서버 하나가 API와 빌드된 프론트엔드 화면을 함께 제공해요.
services:
  - type: web
    name: deartoday
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      # AI 답장/일기 생성에 쓰는 키와 제공자 선택('groq' | 'gemini').
      # 보안상 값은 여기에 적지 않고 Render 대시보드에서 직접 입력·수정함 (sync: false).
      # 쓰는 제공자의 키만 채우면 됨.
      - key: LLM_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # (선택) Gemini 주 모델이 무료 한도(429)에 걸리면 자동으로 넘어갈 예비 모델.
      # 안 넣으면 gemini-flash-lite-latest 가 기본으로 쓰임. 주 모델은 GEMINI_MODEL.
      - key: GEMINI_FALLBACK_MODEL
        sync: false
      # 일기 데이터를 영구 보존할 DB 연결 문자열(Supabase 등의 PostgreSQL).
      # 넣으면 DB에 저장(재배포해도 유지), 비워두면 로컬 파일에 저장(재배포 시 초기화).
      # Supabase → Project Settings → Database → Connection string(URI)에서 복사.
      - key: DATABASE_URL
        sync: false
      # --- 로그인/인증 ---
      # JWT 서명 키(필수). 긴 임의 문자열. generateValue로 Render가 자동 생성하게 함.
      - key: JWT_SECRET
        generateValue: true
      # OAuth 콜백에 쓰이는 앱의 공개 주소. 배포 후 생긴 Render 주소로 설정.
      # 예: https://deartoday-xxxx.onrender.com
      - key: APP_BASE_URL
        sync: false
      # 구글 로그인 (안 넣으면 구글 버튼 비활성). 리디렉션 URI: <APP_BASE_URL>/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # 카카오 로그인 (안 넣으면 카카오 버튼 비활성). Redirect URI: <APP_BASE_URL>/api/auth/kakao/callback
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
