# Render 배포 설정 (Blueprint)
# https://render.com 에서 New → Blueprint → 이 저장소를 선택하면
# 아래 설정대로 서비스가 자동으로 만들어져요.
# 백엔드 서버 하나가 API와 빌드된 프론트엔드 화면을 함께 제공해요.
services:
  - type: web
    name: deartoday
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      # AI 답장/일기 생성에 쓰는 키. 보안을 위해 여기에 값을 적지 않고,
      # Render 대시보드에서 직접 입력하도록 sync: false 로 둠.
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
