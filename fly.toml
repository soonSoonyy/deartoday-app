# Fly.io 앱 설정. `fly launch` 가 이 파일을 읽어 기존 설정을 재사용함.
# app 이름은 전역에서 유일해야 함 — 이미 쓰는 이름이면 fly launch 때 다른 이름을 고르면 됨.
app = "deartoday"
# 한국 사용자와 가까운 도쿄 리전. (DB는 Supabase(뭄바이)라 쿼리 지연이 조금 있지만,
#  AI 응답 시간에 비하면 미미함. 더 줄이려면 Supabase를 가까운 리전으로 새로 만들면 됨.)
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # 비밀이 아닌 설정만 여기 둠. 키/시크릿은 `fly secrets set` 으로 넣음.
  # APP_BASE_URL 은 배포 후 생기는 https://<app>.fly.dev 주소로 secrets에 넣어줘.

[http_service]
  internal_port = 8080
  force_https = true
  # 평소엔 요청이 없으면 머신을 멈춰 비용을 아끼고(스케일 투 제로), 요청이 오면 자동으로 깨움.
  # 항상 켜두고 싶으면(콜드스타트 없이) min_machines_running 을 1로 바꾸면 됨.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
